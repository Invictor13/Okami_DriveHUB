<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okami DriveHUB</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services (GIS) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Estilos imediatos de inicialização para prevenção de tela branca */
      body {
        margin: 0;
        background-color: #0b0f19;
        color: #f8fafc;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes hubPulseSpinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hub-init-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(0, 210, 255, 0.18);
        border-top-color: #00d2ff;
        border-radius: 50%;
        animation: hubPulseSpinner 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </head>
  <body
    style="background-color: #0b0f19; color: #f8fafc; margin: 0; min-height: 100vh;"
    class="bg-console-dark text-slate-100 font-sans antialiased selection:bg-nintendo-cyan selection:text-slate-950 min-h-screen"
  >
    <noscript>
      <div style="display: flex; min-height: 100vh; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; text-align: center; padding: 24px;">
        <div style="max-width: 420px; background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 69, 84, 0.4); border-radius: 16px; padding: 24px;">
          <h2 style="font-size: 18px; font-weight: 700; color: #ff4554; margin: 0 0 10px 0;">JavaScript Necessário</h2>
          <p style="font-size: 14px; color: #94a3b8; margin: 0; line-height: 1.5;">O Okami DriveHUB é uma aplicação interativa que requer JavaScript habilitado no navegador para operar.</p>
        </div>
      </div>
    </noscript>

    <div id="root">
      <div style="display: flex; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; text-align: center; padding: 24px;">
        <div class="hub-init-spinner" style="margin-bottom: 20px;"></div>
        <h1 style="font-size: 20px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 8px 0; color: #f8fafc;">Okami DriveHUB</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Iniciando sistema e console...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
